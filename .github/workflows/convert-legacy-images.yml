name: convert-legacy-images
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert legacy images to WebP
        run: |
          python -m pip install pillow
          python scripts/rewrite-images.py
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate blog pages
        run: node scripts/ryze-convert.mjs
      - name: Commit WebP assets and regenerated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets public/index.html public/blog public/sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m 'Serve legacy images as WebP [skip ci]'
            git push
          else
            echo 'Nothing to commit'
          fi
