name: Build Spanish website pages
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-spanish-pages
  cancel-in-progress: false
jobs:
  spanish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and validate Spanish pages
        run: node scripts/build-spanish.mjs
      - name: Commit localized pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public
          git diff --cached --quiet || git commit -m 'Publish Spanish core pages and English-Spanish navigation'
          git push origin HEAD:main
