name: Import October patient results
on:
  workflow_dispatch:
    inputs:
      image_one:
        required: true
        description: First uploaded image URL
      image_two:
        required: true
        description: Second uploaded image URL
      image_three:
        required: true
        description: Third uploaded image URL
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Save full patient result images
        env:
          IMAGE_ONE: ${{ inputs.image_one }}
          IMAGE_TWO: ${{ inputs.image_two }}
          IMAGE_THREE: ${{ inputs.image_three }}
        run: |
          python - <<'PY'
          import io, os, urllib.request
          from PIL import Image, ImageOps
          os.makedirs('public/assets', exist_ok=True)
          for key, count in [('IMAGE_ONE',2500),('IMAGE_TWO',3000),('IMAGE_THREE',4100)]:
            with urllib.request.urlopen(os.environ[key],timeout=60) as response:
              raw=response.read()
            image=ImageOps.exif_transpose(Image.open(io.BytesIO(raw))).convert('RGB')
            if image.width < 300 or image.height < 300: raise ValueError('Image too small')
            image.save(f'public/assets/peak-result-{count}-6-months.jpg','JPEG',quality=95,optimize=True)
          PY
      - name: Commit result images
        run: |
          git config user.name 'Peak Gallery Import'
          git config user.email 'gallery-import@users.noreply.github.com'
          git add public/assets/peak-result-*-6-months.jpg
          git commit -m 'Add three full six-month patient results'
          git push
