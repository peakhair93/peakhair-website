name: Import more clinic gallery photos
on:
  workflow_dispatch:
    inputs:
      image_one:
        description: Temporary photo link one
        required: true
      image_two:
        description: Temporary photo link two
        required: true
      image_three:
        description: Temporary photo link three
        required: true
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare image tools
        run: python -m pip install pillow
      - name: Save three clinic photographs
        env:
          IMAGE_ONE: ${{ inputs.image_one }}
          IMAGE_TWO: ${{ inputs.image_two }}
          IMAGE_THREE: ${{ inputs.image_three }}
        run: |
          python - <<'PY'
          import io, os, urllib.request, urllib.parse
          from PIL import Image, ImageOps
          os.makedirs('public/assets', exist_ok=True)
          for key, filename in [('IMAGE_ONE','peak-nyc-clinic-room-3.jpg'),('IMAGE_TWO','peak-nyc-clinic-room-4.jpg'),('IMAGE_THREE','peak-nyc-clinic-room-5.jpg')]:
              url=os.environ[key]
              parsed=urllib.parse.urlparse(url)
              if parsed.scheme!='https' or parsed.hostname!='gwvckixiegkllthleuyt.supabase.co' or not parsed.path.startswith('/storage/v1/object/sign/paid-ads-chat-files/'):
                  raise ValueError('Unexpected image link')
              with urllib.request.urlopen(url,timeout=45) as response:
                  raw=response.read(12000000)
              image=ImageOps.exif_transpose(Image.open(io.BytesIO(raw))).convert('RGB')
              image.thumbnail((1500,1500),Image.Resampling.LANCZOS)
              image.save('public/assets/'+filename,'JPEG',quality=85,optimize=True)
              print('Saved',filename,image.size)
          PY
      - name: Commit photos
        run: |
          git config user.name 'Peak Photo Import'
          git config user.email 'photo-import@users.noreply.github.com'
          git add public/assets/peak-nyc-clinic-room-{3,4,5}.jpg
          git commit -m 'Add three Peak clinic gallery photos'
          git push
