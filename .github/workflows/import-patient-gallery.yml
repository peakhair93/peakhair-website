name: Import patient gallery photos
on:
  workflow_dispatch:
    inputs:
      image_one:
        description: Temporary upload link for photo one
        required: true
      image_two:
        description: Temporary upload link for photo two
        required: true
      image_three:
        description: Temporary upload link for photo three
        required: true
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare image tools
        run: python -m pip install pillow
      - name: Save selected before-and-after photographs
        env:
          IMAGE_ONE: ${{ inputs.image_one }}
          IMAGE_TWO: ${{ inputs.image_two }}
          IMAGE_THREE: ${{ inputs.image_three }}
        run: |
          python - <<'PY'
          import io, os, urllib.request
          from PIL import Image, ImageOps
          os.makedirs('public/assets', exist_ok=True)
          items = [
            ('IMAGE_ONE','public/assets/peak-ba-6.jpg',(0.028,0.235,0.970,0.816)),
            ('IMAGE_TWO','public/assets/peak-ba-7.jpg',(0.030,0.290,0.970,0.860)),
            ('IMAGE_THREE','public/assets/peak-ba-8.jpg',(0.040,0.295,0.970,0.606)),
          ]
          for key, path, box in items:
            with urllib.request.urlopen(os.environ[key], timeout=45) as response:
              raw=response.read()
            image=ImageOps.exif_transpose(Image.open(io.BytesIO(raw))).convert('RGB')
            w,h=image.size
            image=image.crop(tuple(round(v*d) for v,d in zip(box,(w,h,w,h))))
            if image.width < 300 or image.height < 200: raise ValueError('Image resolution too small: '+key)
            image.save(path,'JPEG',quality=90,optimize=True)
            print('Saved',path,image.size)
          PY
      - name: Commit gallery photos
        run: |
          git config user.name 'Peak Gallery Import'
          git config user.email 'gallery-import@users.noreply.github.com'
          git add public/assets/peak-ba-{6,7,8}.jpg
          git commit -m 'Store three patient before-and-after photos'
          git push
