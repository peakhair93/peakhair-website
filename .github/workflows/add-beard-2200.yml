name: Prepare beard 2200 gallery photo
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - name: Crop supplied comparison without retouching
        env:
          IMAGE_URL: 'https://c412becc37630f5699bcebcf37ceb143.r2.cloudflarestorage.com/seo-audit-private/paid-ads-chat-files/13cddb2f-38ad-4c6c-81b4-b2cf534cdfd9/08102275-2ce9-4fbc-9cbe-47f8f06a82c8/507aec0c-37f6-44ac-9f3e-fc1cc2a89e7a/237f412d-b398-4295-950e-9b9e9b8f534e.png?X-Amz-Expires=604800&X-Amz-Date=20261123T175329Z&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=95e3a6e2084d13ff3f0c489a4119c5c2%2F20261123%2Fauto%2Fs3%2Faws4_request&X-Amz-SignedHeaders=host&X-Amz-Signature=b94ef86b7a8cf1708d51d5e06610c0f83c1d5d13e3179d72d0dc5becfd66fd4b'
        run: |
          python - <<'PY'
          import os,io,urllib.request
          from PIL import Image,ImageOps
          im=Image.open(io.BytesIO(urllib.request.urlopen(os.environ['IMAGE_URL']).read())).convert('RGB')
          w,h=im.size
          def panel(box):
              return im.crop(tuple(round(v*s) for v,s in zip(box,(w,h,w,h))))
          before=panel((44/819,318/1024,402/819,803/1024))
          after=panel((418/819,318/1024,775/819,803/1024))
          canvas=Image.new('RGB',(760,570))
          canvas.paste(ImageOps.fit(before,(380,570),centering=(.5,.5)),(0,0))
          canvas.paste(ImageOps.fit(after,(380,570),centering=(.5,.5)),(380,0))
          canvas.save('public/assets/peak-beard-2200-4months-gallery.webp','WEBP',quality=94)
          assert Image.open('public/assets/peak-beard-2200-4months-gallery.webp').size==(760,570)
          PY
      - name: Save gallery asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/peak-beard-2200-4months-gallery.webp
          git diff --cached --quiet || git commit -m 'Add original beard patient comparison at gallery dimensions'
          git push
