name: convert-images-webp
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'blog/data/**'
      - 'public/index.html'
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Convert images to WebP and rewrite the homepage
        run: python scripts/convert-images-webp.py
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate blog pages
        run: node scripts/ryze-convert.mjs
      - name: Commit WebP assets and rewritten pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/assets public/blog public/sitemap.xml public/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Serve all homepage and blog images as WebP'
            git push
          else
            echo 'Nothing to commit'
          fi
