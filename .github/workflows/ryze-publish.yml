name: ryze-publish
on:
  push:
    branches:
      - main
      - ryze/publishing-setup
    paths:
      - 'blog/data/**'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate blog pages
        run: node scripts/ryze-convert.mjs
      - name: Commit generated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/blog
          if ! git diff --cached --quiet; then
            git commit -m 'Generate Ryze blog pages [skip ci]'
            git push
          fi
