name: Import consultation photo
on:
  workflow_dispatch:
    inputs:
      image_url:
        description: Temporary client photo link
        required: true
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Store consultation image as a local site asset
        env:
          IMAGE_URL: ${{ inputs.image_url }}
        run: |
          python - <<'PY'
          import io, os, urllib.request, urllib.parse
          from PIL import Image, ImageOps, ImageFilter
          url=os.environ['IMAGE_URL']
          parsed=urllib.parse.urlparse(url)
          if parsed.scheme!='https' or parsed.hostname!='gwvckixiegkllthleuyt.supabase.co' or not parsed.path.startswith('/storage/v1/object/sign/paid-ads-chat-files/'):
              raise ValueError('Unexpected image host or path')
          with urllib.request.urlopen(url, timeout=45) as response:
              raw=response.read(12000000)
          image=ImageOps.exif_transpose(Image.open(io.BytesIO(raw))).convert('RGB')
          canvas_size=(1200,720)
          bg=ImageOps.fit(image,canvas_size,method=Image.Resampling.LANCZOS).filter(ImageFilter.GaussianBlur(32))
          bg=Image.blend(bg,Image.new('RGB',canvas_size,'#e6e0d2'),.23)
          fg=ImageOps.contain(image,canvas_size,method=Image.Resampling.LANCZOS)
          bg.paste(fg,((1200-fg.width)//2,(720-fg.height)//2))
          os.makedirs('public/assets',exist_ok=True)
          bg.save('public/assets/peak-consultation-plan.jpg','JPEG',quality=87,optimize=True)
          print('Saved consultation image')
          PY
      - name: Commit image
        run: |
          git config user.name 'Peak Photo Import'
          git config user.email 'photo-import@users.noreply.github.com'
          git add public/assets/peak-consultation-plan.jpg
          git commit -m 'Add client consultation photo to personalized plan' || exit 0
          git push
