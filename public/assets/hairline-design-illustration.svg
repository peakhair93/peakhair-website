<path d="M313 344Q290 201 357 115Q421 35 548 30Q701 8 787 100Q874 191 856 344Q823 269 770 238Q714 188 648 211Q586 226 554 240Q480 270 410 233Q358 238 313 344Z" fill="url(#hair)"/>
<path d="M322 300Q386 211 438 239Q496 278 568 233Q664 179 728 220Q797 224 848 304" fill="none" stroke="#536854" stroke-width="8" opacity=".55"/>
<g opacity=".3" fill="none" stroke="#879f83" stroke-width="3"><path d="M355 235Q387 133 503 88"/><path d="M386 215Q450 101 582 68"/><path d="M458 218Q551 109 671 84"/><path d="M560 199Q682 116 772 151"/></g>
