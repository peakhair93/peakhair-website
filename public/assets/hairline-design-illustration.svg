<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Drawing a proposed hairline</title><desc id="desc">Illustration of a clinician drawing a curved hairline on a patient's forehead with a marker.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e7ebdf"/><stop offset="1" stop-color="#f4f0e5"/></linearGradient><linearGradient id="skin" x2="1" y2=".4"><stop stop-color="#c88e72"/><stop offset=".55" stop-color="#e8b79a"/><stop offset="1" stop-color="#a96651"/></linearGradient><linearGradient id="hair" x2="0" y2="1"><stop stop-color="#18251d"/><stop offset="1" stop-color="#394b3a"/></linearGradient><linearGradient id="sleeve" x2="0" y2="1"><stop stop-color="#f8f8f3"/><stop offset="1" stop-color="#cdd6ca"/></linearGradient><filter id="shadow"><feGaussianBlur stdDeviation="22"/></filter></defs>
<rect width="1200" height="720" fill="url(#bg)"/><circle cx="150" cy="90" r="310" fill="#fff" opacity=".35"/><path d="M0 590Q300 490 560 605T1200 535V720H0Z" fill="#ced9c8" opacity=".4"/>
<ellipse cx="559" cy="578" rx="385" ry="75" fill="#708b78" opacity=".18" filter="url(#shadow)"/>
<!-- patient shoulder and neck -->
<path d="M185 720Q218 559 425 546L771 552Q962 565 1018 720Z" fill="#233a2b"/><path d="M433 550Q475 586 594 594Q708 586 750 550L727 482H456Z" fill="url(#skin)"/>
